{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="card-header"><h5>Update Ticket #{{ ticket.id }}</h5></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-control">
          <option value="pending" {% if ticket.status == 'pending' %}selected{% endif %}>Pending</option>
          <option value="in_progress" {% if ticket.status == 'in_progress' %}selected{% endif %}>In Progress</option>
          <option value="resolved" {% if ticket.status == 'resolved' %}selected{% endif %}>Resolved</option>
          <option value="closed" {% if ticket.status == 'closed' %}selected{% endif %}>Closed</option>
        </select>
      </div>
      {% if role == 'admin' %}
      <div class="mb-3">
        <label class="form-label">Assign To</label>
        <select name="assigned_to" class="form-control">
          <option value="none">-- Not Assigned --</option>
          {% for tech in technicians %}
          <option value="{{ tech.pk }}" {% if ticket.assigned_to == tech %}selected{% endif %}>
            {{ tech.get_full_name|default:tech.username }}
          </option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      <button type="submit" class="btn btn-warning">Update</button>
      <a href="/tickets/{{ ticket.pk }}/" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
