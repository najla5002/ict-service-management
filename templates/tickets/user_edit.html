{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-bold"><i class="fas fa-user-edit me-2"></i> Edit User: {{ edit_user.username }}</h5>
    <a href="/users/" class="btn btn-secondary btn-sm">
      <i class="fas fa-arrow-left me-1"></i> Back
    </a>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">First Name</label>
          <input type="text" name="first_name" class="form-control" value="{{ edit_user.first_name }}">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">Last Name</label>
          <input type="text" name="last_name" class="form-control" value="{{ edit_user.last_name }}">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Email</label>
        <input type="email" name="email" class="form-control" value="{{ edit_user.email }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Role</label>
        <select name="role" class="form-control">
          <option value="user" {% if edit_profile.role == 'user' %}selected{% endif %}>User</option>
          <option value="technician" {% if edit_profile.role == 'technician' %}selected{% endif %}>Technician</option>
          <option value="admin" {% if edit_profile.role == 'admin' %}selected{% endif %}>Admin</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ edit_profile.phone }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Department</label>
        <input type="text" name="department" class="form-control" value="{{ edit_profile.department }}">
      </div>
      <div class="mb-3">
        <div class="form-check">
          <input type="checkbox" name="is_active" class="form-check-input"
            {% if edit_user.is_active %}checked{% endif %}>
          <label class="form-check-label fw-bold">Active User</label>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-save me-2"></i> Save Changes
      </button>
      <a href="/users/" class="btn btn-secondary ms-2">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
