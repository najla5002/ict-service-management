{% extends 'base.html' %}
{% block content %}
<div class="card">
  <div class="card-header"><h5>{{ title }}</h5></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
        <div class="text-danger">{{ field.errors }}</div>
        {% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Submit Ticket</button>
      <a href="/tickets/" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
